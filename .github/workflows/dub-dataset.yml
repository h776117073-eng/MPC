name: Arabic dubbing - prepared dataset (17 speakers)
on:
  workflow_dispatch:
    inputs:
      start_part:
        description: "First part number (13-22), resuming after the private 12-part checkpoint"
        required: true
        default: "13"
        type: string
      end_part:
        description: "Last part number (1-22)"
        required: true
        default: "22"
        type: string
permissions:
  contents: read
concurrency:
  group: mpc-arabic-dataset-dub
  cancel-in-progress: false
jobs:
  dubbing:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GEMINI_API_KEY: ${{ secrets.GOOGLE_AI }}
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      MPC_ARABIC_DATASET_URL: ${{ secrets.MPC_ARABIC_DATASET_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout MPC
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify required secrets are present
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::MPC secret GOOGLE_AI is empty or unavailable."
            exit 1
          fi
          if [ -z "$MPC_ARABIC_DATASET_URL" ]; then
            echo "::error::Private dataset download credential is missing or expired."
            exit 1
          fi
          if [ -z "$MPC_ARABIC_OUTPUT_URL" ]; then
            echo "::error::Private output checkpoint credential is missing or expired."
            exit 1
          fi
          echo "Google AI key and private dataset credential are present; values remain hidden."
      - name: Download and verify private dataset
        shell: bash
        env:
          DATASET_URL: ${{ secrets.MPC_ARABIC_DATASET_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re, urllib.parse, urllib.request, urllib.error
          url = os.environ.get("DATASET_URL", "")
          parsed = urllib.parse.urlsplit(url)
          checks = {
              "length": len(url),
              "https": parsed.scheme == "https",
              "host_present": bool(parsed.netloc),
              "query_present": bool(parsed.query),
              "no_whitespace": not any(ch.isspace() for ch in url),
              "valid_percent_encoding": not bool(re.search(r"%(?![0-9A-Fa-f]{2})", url)),
          }
          print("Private download URL shape:", checks)
          if not all([checks["https"], checks["host_present"], checks["query_present"],
                      checks["no_whitespace"], checks["valid_percent_encoding"]]):
              raise SystemExit("Private download URL failed shape validation.")
          request = urllib.request.Request(url, headers={"User-Agent": "MPC-private-dataset-fetch/1"})
          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  payload = response.read()
                  print("Private dataset HTTP status:", response.status, "bytes:", len(payload))
          except urllib.error.HTTPError as error:
              print("Private dataset HTTP status:", error.code)
              raise SystemExit("Private dataset download failed at HTTP layer.")
          except Exception as error:
              print("Private dataset download error type:", type(error).__name__)
              raise SystemExit("Private dataset download failed.")
          pathlib.Path("dataset.zip").write_bytes(payload)
          PY
          echo "1f63a19f1e5b92b5129aedd08c95306e  dataset.zip" | md5sum --check -
          mkdir -p dataset
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("dataset.zip") as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("ZIP integrity error at " + str(bad))
              archive.extractall("dataset")
          print("Dataset ZIP integrity and extraction passed.")
          PY
          rm -f dataset.zip
      - name: Restore completed TTS audio from private Drive checkpoint
        shell: bash
        env:
          OUTPUT_URL: ${{ secrets.MPC_ARABIC_OUTPUT_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, urllib.parse, urllib.request
          url = os.environ.get('OUTPUT_URL', '')
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != 'https' or not parsed.netloc or not parsed.query:
              raise SystemExit('Private output checkpoint URL is missing or invalid.')
          request = urllib.request.Request(url, headers={'User-Agent': 'MPC-private-checkpoint-fetch/1'})
          try:
              with urllib.request.urlopen(request, timeout=300) as response:
                  payload = response.read()
                  print('Private checkpoint HTTP:', response.status, 'bytes:', len(payload))
          except Exception as error:
              print('Private checkpoint download error:', type(error).__name__)
              raise SystemExit('Private output checkpoint download failed.')
          pathlib.Path('output_checkpoint.zip').write_bytes(payload)
          PY
          echo "9f7da3926ac418f77ee5d5a97f6f3596  output_checkpoint.zip" | md5sum --check -
          mkdir -p output/dataset_dub
          python - <<'PY'
          import json, pathlib, zipfile
          with zipfile.ZipFile('output_checkpoint.zip') as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit('Private checkpoint ZIP integrity error: ' + str(bad))
              names = archive.namelist()
              if 'manifest.json' not in names or 'summary.json' not in names:
                  raise SystemExit('Private checkpoint is missing manifest.json or summary.json')
              archive.extractall('output/dataset_dub')
          manifest = json.loads(pathlib.Path('output/dataset_dub/manifest.json').read_text(encoding='utf-8'))
          completed = sum(1 for item in manifest.get('parts', {}).values() if item.get('status') == 'complete')
          print('Private checkpoint restored. Completed parts:', completed)
          if completed < 12:
              raise SystemExit('Expected at least 12 completed TTS parts in the private checkpoint.')
          PY
          rm -f output_checkpoint.zip
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.32.3,<3"
      - name: Validate dataset without API calls
        run: |
          python scripts/dub_dataset.py \
            --dataset-root dataset/ARABIC_DUBBING_DATASET \
            --output output/dataset_dub \
            --dry-run \
            --start-part "${{ inputs.start_part }}" \
            --end-part "${{ inputs.end_part }}"
      - name: Generate Arabic speech parts
        run: |
          python scripts/dub_dataset.py \
            --dataset-root dataset/ARABIC_DUBBING_DATASET \
            --output output/dataset_dub \
            --start-part "${{ inputs.start_part }}" \
            --end-part "${{ inputs.end_part }}"
      - name: Upload WAV parts, speaker masters and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpc-arabic-dataset-dub-${{ github.run_id }}
          path: output/dataset_dub/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
